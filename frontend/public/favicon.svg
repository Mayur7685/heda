<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="hedaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff88" />
      <stop offset="100%" stop-color="#00b359" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1710" />
      <stop offset="100%" stop-color="#060907" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#00e479" stroke-width="2" stroke-opacity="0.35" />

  <!-- High-Tech Green "H" Symbol -->
  <g filter="url(#glow)">
    <!-- Left Column -->
    <path d="M16 14 H24 V50 H16 Z" fill="url(#hedaGrad)" rx="2" />
    <!-- Right Column -->
    <path d="M40 14 H48 V50 H40 Z" fill="url(#hedaGrad)" rx="2" />
    <!-- Center Crossbar -->
    <path d="M22 28 H42 V36 H22 Z" fill="url(#hedaGrad)" rx="1.5" />
    
    <!-- Accent Dots / Vision Tech Nodes -->
    <circle cx="20" cy="18" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="44" cy="46" r="1.5" fill="#ffffff" opacity="0.9" />
    <circle cx="32" cy="32" r="2" fill="#ffffff" />
  </g>
</svg>